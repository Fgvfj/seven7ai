<!DOCTYPE html>
<html><head><title>SevenAI</title><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:sans-serif;background:#111;color:#fff;padding:20px}#chat{height:300px;overflow-y:auto;border:1px solid #333;padding:10px}input{width:70%;padding:10px}button{padding:10px}</style>
</head><body>
<h1>SevenAI 🤖</h1><p>Permanent Server - Online</p>
<div id="chat"></div><br>
<input id="msg" placeholder="Type here..."><button onclick="send()">Send</button>
<script>
async function send(){
 let m=document.getElementById('msg').value;
 document.getElementById('chat').innerHTML+=`<p><b>You:</b> ${m}</p>`;
 let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});
 let d=await r.json();
 document.getElementById('chat').innerHTML+=`<p><b>SevenAI:</b> ${d.reply}</p>`;
 document.getElementById('msg').value='';
}
</script></body></html>
